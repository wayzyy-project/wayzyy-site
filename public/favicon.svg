<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- orange circle background -->
  <circle cx="32" cy="32" r="32" fill="#f07623"/>
  <!-- house roof -->
  <polyline
    points="6,30 32,10 58,30"
    fill="none"
    stroke="#1a1a1a"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- chimney -->
  <rect x="43" y="13" width="5" height="8" rx="1" fill="#1a1a1a"/>
  <!-- W letter -->
  <text
    x="32"
    y="58"
    text-anchor="middle"
    font-family="'Arial Rounded MT Bold', 'Varela Round', Arial, sans-serif"
    font-weight="900"
    font-size="30"
    fill="#1a1a1a"
    letter-spacing="-1"
  >W</text>
</svg>
