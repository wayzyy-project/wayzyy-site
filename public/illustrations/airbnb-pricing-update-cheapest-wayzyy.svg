<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" style="background:#ffffff; font-family:'Caveat', 'Architects Daughter', 'Comic Sans MS', cursive, sans-serif;">
  <defs>
    <!-- Sketch Filter for organic hand-drawn wobble -->
    <filter id="roughpaper" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    
    <!-- Red/Pink Hatch for Airbnb -->
    <pattern id="hatch-red" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#fca5a5" stroke-width="1.5" stroke-opacity="0.6" />
    </pattern>
    
    <!-- Blue Hatch for Booking.com -->
    <pattern id="hatch-blue" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#93c5fd" stroke-width="1.5" stroke-opacity="0.6" />
    </pattern>
    
    <!-- Green Hatch for Wayzyy -->
    <pattern id="hatch-green" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#86efac" stroke-width="1.5" stroke-opacity="0.7" />
    </pattern>
    
    <!-- Marker Arrowheads -->
    <marker id="arrow-down" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-up" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#15803d" />
    </marker>
  </defs>

  <style>
    .title { font-size: 32px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
    .box-title { font-size: 26px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .box-desc { font-size: 20px; font-weight: 600; fill: #1e293b; text-anchor: middle; line-height: 1.3; }
    .label-danger { font-size: 24px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .label-success { font-size: 25px; font-weight: 800; fill: #15803d; text-anchor: middle; }
    .sketch-stroke { stroke: #1e293b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .sketch-stroke-green { stroke: #15803d; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- Group with rough paper hand-drawn filter -->
  <g filter="url(#roughpaper)">
    
    <!-- 1. Airbnb Column -->
    <!-- Title -->
    <text x="210" y="85" class="box-title">Airbnb</text>
    <!-- Background Hatch -->
    <rect x="110" y="110" width="200" height="200" rx="4" fill="url(#hatch-red)" />
    <!-- Outer Rough Border (Simulated 2 passes for hand-drawn look) -->
    <rect x="110" y="110" width="200" height="200" rx="3" fill="none" class="sketch-stroke" />
    <path d="M 112 110 L 308 112 L 310 308 L 110 310 Z" fill="none" stroke="#1e293b" stroke-width="1.5" />
    <!-- Text Inside -->
    <text x="210" y="185" class="box-desc" font-weight="700">16–24%</text>
    <text x="210" y="215" class="box-desc">commission</text>
    <text x="210" y="245" class="box-desc">per booking</text>

    <!-- 2. Booking.com / MMT Column -->
    <!-- Title -->
    <text x="500" y="85" class="box-title">Booking.com / MMT</text>
    <!-- Background Hatch -->
    <rect x="400" y="110" width="200" height="200" rx="4" fill="url(#hatch-blue)" />
    <!-- Outer Rough Border -->
    <rect x="400" y="110" width="200" height="200" rx="3" fill="none" class="sketch-stroke" />
    <path d="M 402 111 L 599 110 L 600 309 L 401 310 Z" fill="none" stroke="#1e293b" stroke-width="1.5" />
    <!-- Text Inside -->
    <text x="500" y="185" class="box-desc" font-weight="700">15–22%</text>
    <text x="500" y="215" class="box-desc">commission</text>
    <text x="500" y="245" class="box-desc">per booking</text>

    <!-- 3. Wayzyy Column -->
    <!-- Title -->
    <text x="790" y="85" class="box-title" fill="#FF6B00" font-weight="800">Wayzyy</text>
    <!-- Background Hatch -->
    <rect x="690" y="110" width="200" height="200" rx="4" fill="url(#hatch-green)" />
    <!-- Outer Rough Border -->
    <rect x="690" y="110" width="200" height="200" rx="3" fill="none" class="sketch-stroke-green" />
    <path d="M 691 112 L 889 110 L 890 309 L 690 311 Z" fill="none" stroke="#15803d" stroke-width="2" />
    <!-- Text Inside -->
    <text x="790" y="170" class="box-desc" font-weight="700" fill="#14532d">Recharge-</text>
    <text x="790" y="198" class="box-desc" fill="#14532d">based model</text>
    <text x="790" y="230" class="box-desc" font-weight="700" fill="#15803d">(~2–3%</text>
    <text x="790" y="258" class="box-desc" fill="#15803d">effective fee)</text>

    <!-- Downward Arrows for High Fees -->
    <!-- Airbnb arrow -->
    <path d="M 240 330 L 290 410" fill="none" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrow-down)" stroke-linecap="round" />
    <!-- Booking.com arrow -->
    <path d="M 470 330 L 420 410" fill="none" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrow-down)" stroke-linecap="round" />
    
    <!-- High Fees Label -->
    <text x="355" y="450" class="label-danger">High fees &amp; inflated prices</text>

    <!-- Upward Arrow for Wayzyy -->
    <path d="M 790 415 L 790 335" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrow-up)" stroke-linecap="round" />
    
    <!-- Wayzyy Cheapest Label -->
    <text x="790" y="448" class="label-success">Cheapest price in market</text>
    <text x="790" y="475" class="box-desc" fill="#15803d" font-weight="700">(Direct host rates)</text>

  </g>
</svg>
